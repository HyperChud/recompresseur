<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src blob: data:">
<title>Recompresseur</title>
<style>
:root{color-scheme:dark;--bg:#0e0e0f;--bar:#151517;--panel:#18181b;--line:#2a2a2f;--hover:#222226;--ink:#e9e9ec;--mute:#8d8d96;--acc:#ff6a2b;--sat:0px;--sab:0px;--kb:0px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 Roboto,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{width:20px;height:20px;fill:currentColor;flex:none}
#app{position:fixed;left:0;right:0;top:0;bottom:var(--kb);display:flex;flex-direction:column;padding:var(--sat) 0 var(--sab)}

.top{flex:none;height:48px;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;background:var(--bar);border-bottom:1px solid var(--line)}
.b.ic:disabled{opacity:.3}
.logo{width:32px;height:32px;border-radius:7px;flex:none;margin-right:6px}
@media(max-width:430px){.top h1{font-size:0!important}}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{height:34px;padding:0 12px;border-radius:4px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.b:active{background:var(--hover)}
.b.acc{background:var(--acc);border-color:var(--acc);color:#140700;font-weight:600}
.b.acc:active{filter:brightness(.9)}
.b.ic{width:34px;padding:0}

.stage{flex:1;min-height:160px;position:relative;overflow:hidden;background:#000}
.stage img{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.stage.zoom{overflow:auto}
.stage.zoom img{position:static;width:auto;height:auto;max-width:none;display:block;margin:0 auto}
.stage.zoom .ov{display:none}
#prog{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);opacity:0;transition:opacity .2s}
#prog.on{opacity:1}
.ov{position:absolute}
#info{left:6px;bottom:6px;font-size:11px;color:#bbb;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:2px;font-variant-numeric:tabular-nums;max-width:calc(100% - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#cmp{right:6px;bottom:6px;height:28px;padding:0 10px;border-radius:3px;background:rgba(24,24,27,.9);border:1px solid var(--line);font-size:12px;font-weight:500;touch-action:none}
#cmp.on{border-color:var(--acc);color:var(--acc)}

.tabs{flex:none;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bar);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:40px;padding:0 7px;font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.tab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}

.panel{flex:none;height:clamp(200px,36vh,320px);overflow-y:auto;background:var(--panel);padding:0 14px 14px;overscroll-behavior:contain;scrollbar-width:thin}
.pane{display:none}.pane.on{display:block}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:12px 0 4px}
.sec+.row,.pane>.sec:first-child{border-top:0}
.pane .sec:not(:first-child){border-top:1px solid var(--line);margin-top:6px}

.row{display:grid;grid-template-columns:40% minmax(0,1fr) 50px;align-items:center;gap:10px;height:42px;touch-action:pan-y;cursor:ew-resize}
.row .lb{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.row .vl.off{color:var(--mute)}
.row.drag .lb,.row.drag .vl{color:var(--acc)}
.sl{position:relative;height:100%;--f:0;--l:0;--w:0}
.sl .tr{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#3a3a41}
.sl .tr i{position:absolute;top:0;bottom:0;left:calc(var(--l)*100%);width:calc(var(--w)*100%);background:var(--acc)}
.sl b{position:absolute;top:50%;left:calc(var(--f)*100%);width:10px;height:18px;margin:-9px 0 0 -5px;border-radius:2px;background:var(--ink)}
.row.drag .sl b{background:var(--acc)}

.tg{display:flex;align-items:center;justify-content:space-between;height:42px;width:100%;text-align:left;font-size:13px}
.ck{width:18px;height:18px;border:1.5px solid #55555e;border-radius:3px;display:grid;place-items:center}
.ck svg{width:14px;height:14px;opacity:0}
.tg.on .ck{background:var(--acc);border-color:var(--acc);color:#140700}.tg.on .ck svg{opacity:1}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0}
.pb{height:38px;border:1px solid var(--line);border-radius:3px;text-align:left;padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb.on{border-color:var(--acc);color:var(--acc)}
.pm{display:flex}.pm .pb{flex:1;border-radius:3px 0 0 3px}.pm .x{width:34px;border:1px solid var(--line);border-left:0;border-radius:0 3px 3px 0;color:var(--mute);font-size:16px}
.pm .pb.on+.x{border-color:var(--acc)}
.line{display:flex;gap:6px;padding:6px 0}
.in{flex:1;height:38px;border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:0 10px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc)}
.lnk{font-size:12px;color:var(--mute);text-transform:none;letter-spacing:0;font-weight:500;padding:4px 0 4px 8px}
.empty{font-size:12px;color:var(--mute);padding:6px 0}
.note{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.45}

.grid.r4{grid-template-columns:repeat(4,1fr)}.grid.r3{grid-template-columns:repeat(3,1fr)}.grid .pb.c{text-align:center;padding:0 4px}
#crop{position:absolute;inset:0;touch-action:none;display:none;background:#000}
.stage.cropping #crop{display:block}.stage.cropping>img,.stage.cropping .ov{display:none}
#cimg{position:absolute}
.shd{position:absolute;background:rgba(0,0,0,.68);pointer-events:none}
#ctb{position:absolute;left:0;right:0;bottom:0;background:rgba(14,14,15,.94);border-top:1px solid var(--line);padding:6px 8px 8px}
#ctb .rs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}#ctb .rs::-webkit-scrollbar{display:none}
#ctb .rs button{flex:none;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:3px;font-size:12px}
#ctb .rs button.on{border-color:var(--acc);color:var(--acc)}
#ctb .ra{display:flex;align-items:center;gap:6px}#ctb .ra .b{height:34px}
#cdim{flex:1;text-align:center;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#cbox{position:absolute;border:1px solid #fff;background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.35) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.35) 0 calc(66.66% + .5px),transparent 0),linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.35) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.35) 0 calc(66.66% + .5px),transparent 0)}
#cbox .h{position:absolute;width:44px;height:44px}
#cbox .h::after{content:"";position:absolute;width:14px;height:14px;border:3px solid #fff}
.h.tl{left:-22px;top:-22px}.h.tl::after{left:19px;top:19px;border-right:0;border-bottom:0}
.h.tr{right:-22px;top:-22px}.h.tr::after{right:19px;top:19px;border-left:0;border-bottom:0}
.h.bl{left:-22px;bottom:-22px}.h.bl::after{left:19px;bottom:19px;border-right:0;border-top:0}
.h.br{right:-22px;bottom:-22px}.h.br::after{right:19px;bottom:19px;border-left:0;border-top:0}
.cact{display:none;gap:6px;padding:6px 0}.cropping-on .cact{display:flex}.cact .b{flex:1}
.cinfo{font-size:12px;color:var(--mute);padding:2px 0 4px}
#snack{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + var(--kb) + 12px);background:#2a2a2f;border-left:3px solid var(--acc);border-radius:3px;padding:10px 12px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .15s,transform .15s;pointer-events:none;z-index:5}
#snack.on{opacity:1;transform:none}
button:focus-visible,.row:focus-visible,input:focus-visible{outline:1px solid var(--acc);outline-offset:1px}

@media(min-width:760px) and (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:48px 41px minmax(0,1fr)}
  .top{grid-column:1/3}.stage{grid-row:2/4}.tabs{grid-column:2}.panel{grid-column:2;height:auto;border-left:1px solid var(--line)}
}
</style>
</head>

const row=s=>`<div class="row" data-k="${s.k}" tabindex="0" role="slider" aria-label="${esc(tr(s.l))}" aria-valuemin="${s.min}" aria-valuemax="${s.max}"><span class="lb">${esc(tr(s.l))}</span><div class="sl" id="s-${s.k}"><div class="tr"><i></i></div><b></b></div><output class="vl" id="o-${s.k}"></output></div>`;

function buildUI(){

  $('tabs').innerHTML=TABS.map(([n],i)=>`<button class="tab" type="button" role="tab" data-t="${i}">${esc(tr(n))}</button>`).join('');
  $('panel').innerHTML=TABS.map(([n,secs],i)=>`<div class="pane" data-p="${i}">${
    i===0
    ?`<div class="sec">Presets</div><div class="grid" id="presets"></div><div class="sec">${L('Les tiens','Yours')}</div><div class="grid" id="mine"></div><div class="line"><input class="in" id="pname" maxlength="30" placeholder="${L('Nom du preset','Preset name')}"><button class="b" id="psave" type="button">${L('Sauver','Save')}</button></div><div class="sec">${L('Réglages','Settings')}<button class="lnk" id="reset" type="button">${L('Tout réinitialiser','Reset all')}</button></div><p class="note">${L('Glisse horizontalement sur une ligne pour régler, un geste vertical fait défiler. Double-tap sur une ligne : valeur par défaut. Touche l’image pour zoomer.','Drag sideways on a row to adjust, a vertical swipe scrolls. Double-tap a row to reset it. Tap the image to zoom in.')}</p><div class="sec">${L('Langue','Language')}</div><div class="grid r3" id="langs">${LANGS.map(([k,n])=>`<button class="pb c${k===LANG?' on':''}" type="button" data-lang="${k}">${esc(tr(n))}</button>`).join('')}</div>`

  }</div>`).join('');

function setLang(k){
  if(k===LANG)return;LANG=k;try{localStorage.setItem('recomp-lang',k)}catch(e){}
  if(cropping)cropEnd(false);
  const sc=$('panel').scrollTop;setFR();buildUI();renderPresets();sync();showTab(tab);$('panel').scrollTop=sc;
  if(src&&outURL)$('info').textContent=info(last);
}
function showTab(i){if(cropping&&i!==tab)cropEnd(true);tab=i;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.t===i));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',+p.dataset.p===i));$('panel').scrollTop=0;store()}

const fmt=k=>{const v=P[k],c=C[k];if(v===0&&OFF.includes(k))return'off';return(v>0&&c.min<0?'+':'')+(c.st<1?v.toFixed(1):v)+c.u};

  $('presets').innerHTML=PRESETS.map((x,i)=>`<button class="pb" type="button" data-i="${i}">${esc(tr(x.n))}</button>`).join('');
  $('mine').innerHTML=mine.length?mine.map((x,i)=>`<div class="pm"><button class="pb" type="button" data-m="${i}">${esc(x.n)}</button><button class="x" type="button" data-x="${i}" aria-label="${L('Supprimer','Delete')} ${esc(x.n)}">×</button></div>`).join(''):`<div class="empty">${L('Aucun pour l’instant.','None yet.')}</div>`;
}
function sync(){
  for(const k in C){const c=C[k],s=$('s-'+k),o=$('o-'+k);s.style.setProperty('--f',(P[k]-c.min)/(c.max-c.min));{const f=(P[k]-c.min)/(c.max-c.min),z=c.min<0?(-c.min)/(c.max-c.min):0;s.style.setProperty('--l',Math.min(f,z));s.style.setProperty('--w',Math.abs(f-z))}s.parentNode.setAttribute('aria-valuenow',P[k]);o.textContent=fmt(k);o.classList.toggle('off',o.textContent==='off')}

  if(document.activeElement!==$('wm'))$('wm').value=P.wm;if(document.activeElement!==$('cap'))$('cap').value=P.cap;
  const cr=P.cw<1||P.ch<1||P.cx>0||P.cy>0;$('cinfo').textContent=src?(cr?`${L('Recadré :','Cropped:')} ${Math.round(P.cw*src.width)}×${Math.round(P.ch*src.height)} px`:`${L('Image entière :','Whole image:')} ${src.width}×${src.height} px`):'';
  document.querySelectorAll('#presets .pb,#mine .pb').forEach(c=>{const p=c.dataset.i!=null?PRESETS[c.dataset.i].p:mine[c.dataset.m].p;c.classList.toggle('on',Object.keys(p).every(k=>p[k]===P[k]))});
}
function set(k,v){
  const c=C[k];v=Math.round(v/c.st)*c.st;v=+Math.min(c.max,Math.max(c.min,v)).toFixed(2);
  if(v===P[k])return;P[k]=v;

  if(k==='smin'&&P.smin>P.smax)P.smax=P.smin;if(k==='smax'&&P.smax<P.smin)P.smin=P.smax;

// Gestures: clearly horizontal drag = adjust; vertical = scroll; double-tap = reset to default
const pn=$('panel');let g=null,lastTap={k:null,t:0},drafting=false;
const start=(r,x,y)=>{g={r,k:r.dataset.k,x,y,v:P[r.dataset.k],on:false,moved:false}};
const move=(x,y)=>{
  if(!g)return false;const dx=x-g.x,dy=y-g.y;
  if(Math.abs(dx)>6||Math.abs(dy)>6)g.moved=true;
  if(!g.on){
    if(Math.abs(dy)>8&&Math.abs(dy)>=Math.abs(dx)){g=null;return false}
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*2){g.on=true;g.x=x;g.r.classList.add('drag');drafting=true}
    return g.on;
  }
  const c=C[g.k],w=g.r.querySelector('.sl').clientWidth;set(g.k,g.v+(x-g.x)/w*(c.max-c.min));return true;
};
const end=()=>{
  if(!g)return;
  const was=g.on;g.r.classList.remove('drag');
  if(!g.moved){const now=Date.now();if(lastTap.k===g.k&&now-lastTap.t<320){set(g.k,DEF[g.k]);say(L(`${tr(C[g.k].l)} : valeur par défaut`,`${tr(C[g.k].l)}: default value`));lastTap={k:null,t:0}}else lastTap={k:g.k,t:now}}
  g=null;
  if(was){drafting=false;schedule();setTimeout(commit,0)}
};
pn.addEventListener('touchstart',e=>{const r=e.target.closest('.row');if(!r||e.touches.length>1){if(g){g.r.classList.remove('drag');g=null}return}start(r,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
pn.addEventListener('touchmove',e=>{if(!g)return;const was=g.on;if((move(e.touches[0].clientX,e.touches[0].clientY)||was)&&e.cancelable)e.preventDefault()},{passive:false});
pn.addEventListener('touchend',end);pn.addEventListener('touchcancel',()=>{if(g){g.moved=true;end()}});
pn.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const r=e.target.closest('.row');if(!r)return;start(r,e.clientX,e.clientY);r.setPointerCapture(e.pointerId)});
pn.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&g){if(!g.on&&Math.abs(e.clientX-g.x)>3){g.on=true;g.x=e.clientX;g.r.classList.add('drag');drafting=true}if(g.on)move(e.clientX,e.clientY);else if(Math.abs(e.clientY-g.y)>3)g.moved=true}});
pn.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')end()});
pn.addEventListener('keydown',e=>{const r=e.target.closest('.row');if(!r)return;const k=r.dataset.k,d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){e.preventDefault();set(k,P[k]+d*C[k].st)}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();set(k,DEF[k])}});
pn.addEventListener('click',e=>{
  const t=e.target.closest('.tg');if(t){const k=t.dataset.t;P[k]=!P[k];sync();store();schedule();return}
  const x=e.target.closest('.x');if(x){mine.splice(+x.dataset.x,1);renderPresets();sync();store();return}
  const c=e.target.closest('#presets .pb,#mine .pb');if(c){Object.assign(P,DEF,c.dataset.i!=null?PRESETS[c.dataset.i].p:mine[c.dataset.m].p,Object.fromEntries(KEEP.map(k=>[k,P[k]])));sync();store();schedule();return}
  if(e.target.closest('#psave')){const n=$('pname').value.trim()||'Preset '+(mine.length+1);const p={};for(const k in DEF)if(!KEEP.includes(k))p[k]=P[k];mine.push({n,p});$('pname').value='';$('pname').blur();renderPresets();sync();store();say(L(`Preset « ${n} » sauvé`,`Preset “${n}” saved`));return}
  {const l=e.target.closest('[data-lang]');if(l){setLang(l.dataset.lang);return}}
  if(e.target.closest('#reset')){Object.assign(P,DEF);sync();store();schedule();say(L('Réglages réinitialisés','Settings reset'))}
});
let wmT=null;pn.addEventListener('input',e=>{const id=e.target.id;if(id==='wm'||id==='cap'){P[id]=e.target.value;store();clearTimeout(wmT);wmT=setTimeout(schedule,250)}});
$('seed').onclick=()=>{P.seed=(Math.random()*1e9)|0;store();schedule()};

// ------------------------------------------------------------ engine
function caption(ctx,w,h){
  const fs=Math.max(10,Math.round(h*P.capSize/100)),pad=fs*.42,lh=fs*1.2;
  ctx.save();ctx.font=`500 ${fs}px Roboto,"Helvetica Neue",Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=[];let cur='';for(const wd of P.cap.trim().split(/\s+/)){const t=cur?cur+' '+wd:wd;if(cur&&ctx.measureText(t).width>w*.92){lines.push(cur);cur=wd}else cur=t}lines.push(cur);
  const bh=lines.length*lh+pad*2,y=Math.max(0,Math.min(h-bh,h*P.capPos/100-bh/2));
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,y,w,bh);ctx.fillStyle='#fff';
  lines.forEach((l,i)=>ctx.fillText(l,w/2,y+pad+lh*(i+.5)));ctx.restore();
}
const pg=$('prog');const prog=f=>{pg.style.transform=`scaleX(${Math.max(.04,f)})`};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const c2d=c=>c.getContext('2d',{willReadFrequently:true});
// Synchronous JPEG encoding: canvas.toBlob waits for the WebView to go idle, which made renders stall
const toBlob=(c,q)=>{const d=c.toDataURL('image/jpeg',q),b=atob(d.slice(d.indexOf(',')+1)),n=b.length,u=new Uint8Array(n);for(let i=0;i<n;i++)u[i]=b.charCodeAt(i);return Promise.resolve(new Blob([u],{type:'image/jpeg'}))};
const LV=[0,64,48,32,24,16,12,8,6];

function chromaBleed(d,w,h,r){
  const n=w*h,cb=new Float32Array(n),cr=new Float32Array(n),Y=new Float32Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){const R=d[p],G=d[p+1],B=d[p+2];Y[i]=.299*R+.587*G+.114*B;cb[i]=B-Y[i];cr[i]=R-Y[i]}
  const sh=Math.round(r/2),tmp=new Float32Array(w);
  for(const ch of[cb,cr])for(let y=0;y<h;y++){
    const o=y*w;let s=0;
    for(let x=-r;x<=r;x++)s+=ch[o+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){tmp[x]=s/(2*r+1);s+=ch[o+Math.min(w-1,x+r+1)]-ch[o+Math.max(0,x-r)]}
    for(let x=0;x<w;x++)ch[o+x]=tmp[Math.max(0,x-sh)];
  }
  for(let i=0,p=0;i<n;i++,p+=4){const R=Y[i]+cr[i],B=Y[i]+cb[i],G=(Y[i]-.299*R-.114*B)/.587;d[p]=R;d[p+1]=G;d[p+2]=B}
}
function fx(ctx,w,h,R,first){
  const sat=1+P.sat/100,con=1+P.con/100,wm=P.warm*.6,sh=P.sharp/200,nz=P.noise*2.2,lum=P.lum*1.5,lift=P.lift*3,lv=LV[P.post],mo=first?P.moire*3:0;
  if(sat===1&&con===1&&!wm&&!sh&&!nz&&!lum&&!lift&&!lv&&!mo&&!P.chroma)return;
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  if(P.chroma)chromaBleed(d,w,h,Math.max(1,Math.round(P.chroma*w/1000)));
  if(sh){const s=new Uint8ClampedArray(d),W=w*4;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*W+x*4;
      for(let c=0;c<3;c++){const j=i+c;d[j]=s[j]*(1+4*sh)-sh*(s[j-4]+s[j+4]+s[j-W]+s[j+W])}}}
  let ma=0,mf=0;if(mo){ma=R()*Math.PI;mf=2*Math.PI/(3+R()*3)}
  const ca=Math.cos(ma)*mf,sa=Math.sin(ma)*mf,q=lv?255/(lv-1):0,lk=1-lift/255;
  for(let i=0,p=0;p<d.length;i++,p+=4){
    let r=d[p],g=d[p+1],b=d[p+2];
    const l=.299*r+.587*g+.114*b;
    r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat;
    r=(r-128)*con+128+wm+lum;g=(g-128)*con+128+wm*.35+lum;b=(b-128)*con+128-wm+lum;
    if(lift){r=lift+r*lk;g=lift+g*lk;b=lift+b*lk}
    if(mo){const x=i%w,y=(i/w)|0,ph=x*ca+y*sa;r+=mo*Math.sin(ph);g+=mo*Math.sin(ph+2.1);b+=mo*Math.sin(ph+4.2)}
    if(nz){const n=(R()+R()-1)*nz;r+=n;g+=n;b+=n}
    if(lv){r=Math.round(r/q)*q;g=Math.round(g/q)*q;b=Math.round(b/q)*q}
    d[p]=r;d[p+1]=g;d[p+2]=b;

}
function watermark(ctx,w,h,corner){
  const fs=Math.max(8,Math.round(h*P.wmSize/100)),m=fs*.7;
  ctx.font=`700 ${fs}px Roboto,system-ui,sans-serif`;ctx.textBaseline='alphabetic';
  const tw=ctx.measureText(P.wm).width,x=corner%2?w-tw-m:m,y=corner<2?m+fs*.8:h-m;
  ctx.lineWidth=Math.max(1,fs/8);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.fillStyle='rgba(255,255,255,.6)';

let src=null,srcURL='',tok=0,busy=false;
async function render(cap,my){
  const R=rng(P.seed);
  const SX=Math.round(P.cx*src.width),SY=Math.round(P.cy*src.height),SW=Math.max(8,Math.round(P.cw*src.width)),SH=Math.max(8,Math.round(P.ch*src.height));
  const k=Math.min(1,cap/Math.max(SW,SH));
  const W0=Math.round(SW*k);let H0=Math.round(SH*k);
  const cs=Math.max(W0,H0)/1000;
  let cur=mk(W0,H0);c2d(cur).drawImage(src,SX,SY,SW,SH,0,0,W0,H0);
  if(P.bars){const bh=Math.round(H0*P.bars/100),c=mk(W0,H0+2*bh),x=c2d(c);x.fillStyle='#000';x.fillRect(0,0,W0,H0+2*bh);x.drawImage(cur,0,bh);cur=c;H0+=2*bh}
  if(P.cap.trim()&&!P.capLate)caption(c2d(cur),cur.width,cur.height);
  const wmAt=P.wm.trim()?Math.floor(R()*Math.ceil(P.passes/2)):-1,corner=Math.floor(R()*4);
  for(let i=0;i<P.passes;i++){
    if(my!==tok)return null;
    prog(i/P.passes);
    const cw=cur.width,ch=cur.height,cr=()=>Math.round(R()*P.crop*cs);
    const sx=cr(),sy=cr(),sw=Math.max(16,cw-sx-cr()),sh=Math.max(16,ch-sy-cr());
    const s=(P.smin+R()*(P.smax-P.smin))/100;
    const tw=Math.max(16,Math.round(W0*s)),th=Math.max(16,Math.round(tw*sh/sw));
    const t=mk(tw,th),tc=c2d(t);
    tc.imageSmoothingEnabled=!P.pix;if(!P.pix)tc.imageSmoothingQuality=R()<.5?'low':'medium';
    if(P.blur)tc.filter=`blur(${(P.blur/12*tw/1000).toFixed(2)}px)`;
    const a=P.rot?(R()*2-1)*P.rot*Math.PI/180:0;
    if(a){const f=Math.abs(Math.cos(a))+Math.abs(Math.sin(a))*Math.max(tw/th,th/tw);tc.translate(tw/2,th/2);tc.rotate(a);tc.scale(f,f);tc.drawImage(cur,sx,sy,sw,sh,-tw/2,-th/2,tw,th);tc.setTransform(1,0,0,1,0,0)}
    else tc.drawImage(cur,sx,sy,sw,sh,0,0,tw,th);
    tc.filter='none';
    if(i===wmAt)watermark(tc,tw,th,corner);
    fx(tc,tw,th,R,i===0);
    const blob=await toBlob(t,(P.qmin+R()*(P.qmax-P.qmin))/100);
    const bm=await createImageBitmap(blob);
    const fw=i===P.passes-1&&P.keepSmall?tw:W0,fh=Math.round(fw*th/tw);
    cur=mk(fw,fh);const cc=c2d(cur);cc.imageSmoothingEnabled=!P.pix;cc.drawImage(bm,0,0,fw,fh);bm.close&&bm.close();
  }
  if(P.cap.trim()&&P.capLate)caption(c2d(cur),cur.width,cur.height);
  return{blob:await toBlob(cur,P.qfin/100),w:cur.width,h:cur.height};
}

let outURL='',last=null;
const info=r=>FR
  ?`${r.w}×${r.h} · ${(r.blob.size/1024).toFixed(0)} Ko · ${r.passes} passe${r.passes>1?'s':''}${r.draft?' · aperçu rapide':''}`
  :`${r.w}×${r.h} · ${(r.blob.size/1024).toFixed(0)} KB · ${r.passes} pass${r.passes>1?'es':''}${r.draft?' · quick preview':''}`;
function show(r){
  if(outURL)URL.revokeObjectURL(outURL);
  outURL=URL.createObjectURL(r.blob);$('out').src=outURL;
  r.passes=P.passes;last=r;$('info').textContent=info(r);
}
async function run(){
  busy=true;pg.classList.add('on');
  const my=tok,draft=drafting;let r=null;
  try{r=await render(draft?520:1000,my)}catch(e){say(L('Erreur de rendu : ','Render error: ')+e.message)}
  if(r)r.draft=draft;
  busy=false;
  if(my!==tok)return run();
  pg.classList.remove('on');prog(0);
  if(r)show(r);
}
function schedule(){tok++;if(!busy&&src)run()}
async function load(blob,quiet){
  try{
    const b=await createImageBitmap(blob);
    src&&src.close&&src.close();src=b;
    if(srcURL)URL.revokeObjectURL(srcURL);srcURL=URL.createObjectURL(blob);
    Object.assign(P,{cx:0,cy:0,cw:1,ch:1});if(cropping)cropEnd(false);sync();store();
    if(!quiet)say(`${L('Image chargée','Image loaded')} · ${b.width}×${b.height}`);
    $('stage').classList.remove('zoom');schedule();
  }catch(e){say(L('Impossible de lire cette image','Can’t read this image'))}
}
window.sayKey=k=>say(({share:L('Impossible d’ouvrir l’image partagée','Couldn’t open the shared image'),saved:L('Image enregistrée','Image saved'),fail:L('Échec de l’enregistrement','Saving failed'),pics:L('Enregistrée dans Images/Recompresseur','Saved to Pictures/Recompresseur')})[k]||k);
window.loadB64=b=>{const x=atob(b),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);load(new Blob([u]))};

const stg=$('stage'),cmp=$('cmp');

// ------------------------------------------------------------ crop
let B=null,ratio=0,IR=null;
const cimg=$('cimg'),cbox=$('cbox');
function layoutCrop(){
  const tb=$('ctb').offsetHeight,sw=stg.clientWidth-40,sh=stg.clientHeight-tb-40,sc=Math.min(sw/src.width,sh/src.height);
  IR={x:20+(sw-src.width*sc)/2,y:20+(sh-src.height*sc)/2,w:src.width*sc,h:src.height*sc};
  Object.assign(cimg.style,{left:IR.x+'px',top:IR.y+'px',width:IR.w+'px',height:IR.h+'px'});
  const bx=IR.x+B.x*IR.w,by=IR.y+B.y*IR.h,bw=B.w*IR.w,bh=B.h*IR.h;
  Object.assign(cbox.style,{left:bx+'px',top:by+'px',width:bw+'px',height:bh+'px'});
  const st=(el,l,t,w,h)=>Object.assign($(el).style,{left:l+'px',top:t+'px',width:Math.max(0,w)+'px',height:Math.max(0,h)+'px'});
  st('shT',IR.x,IR.y,IR.w,by-IR.y);st('shB',IR.x,by+bh,IR.w,IR.y+IR.h-by-bh);st('shL',IR.x,by,bx-IR.x,bh);st('shR',bx+bw,by,IR.x+IR.w-bx-bw,bh);
  $('cdim').textContent=`${Math.round(B.w*src.width)}×${Math.round(B.h*src.height)}`;
}
// pixel aspect ratio → ratio in normalized coordinates
const rn=()=>ratio>0?ratio*src.height/src.width:0;
function fitRatio(){
  const r=rn();if(!r)return;
  const cx=B.x+B.w/2,cy=B.y+B.h/2;let w=B.w,h=w/r;if(h>B.h){h=B.h;w=h*r}
  if(w>1){w=1;h=w/r}if(h>1){h=1;w=h*r}
  B={x:Math.min(1-w,Math.max(0,cx-w/2)),y:Math.min(1-h,Math.max(0,cy-h/2)),w,h};
}
function cropStart(ri){
  if(!src)return;
  if(!cropping){cropping=true;B={x:P.cx,y:P.cy,w:P.cw,h:P.ch};cimg.src=srcURL;stg.classList.remove('zoom');stg.classList.add('cropping')}
  const r=RATIOS[ri]||RATIOS[0];ratio=r[1]===-1?src.width/src.height:r[1];
  if(r[1]===-1)B={x:0,y:0,w:1,h:1};
  fitRatio();
  document.querySelectorAll('#ratios button').forEach(b=>b.classList.toggle('on',+b.dataset.r===ri));
  layoutCrop();sync();
}
function cropEnd(ok){
  if(ok&&B)Object.assign(P,{cx:+B.x.toFixed(4),cy:+B.y.toFixed(4),cw:+B.w.toFixed(4),ch:+B.h.toFixed(4)});
  if(!cropping)return;cropping=false;stg.classList.remove('cropping');document.querySelectorAll('#ratios button').forEach(b=>b.classList.remove('on'));
  sync();store();if(ok)schedule();
}
let cd=null;
$('crop').addEventListener('pointerdown',e=>{if(!cropping||e.target.closest('#ctb'))return;const h=e.target.dataset.h||(e.target===cbox?'move':null);if(!h)return;e.preventDefault();$('crop').setPointerCapture(e.pointerId);cd={h,x:e.clientX,y:e.clientY,b:{...B}}});
$('crop').addEventListener('pointermove',e=>{
  if(!cd)return;const dx=(e.clientX-cd.x)/IR.w,dy=(e.clientY-cd.y)/IR.h,o=cd.b,MIN=.05,r=rn();
  if(cd.h==='move'){B={...o,x:Math.min(1-o.w,Math.max(0,o.x+dx)),y:Math.min(1-o.h,Math.max(0,o.y+dy))}}
  else{
    const L=cd.h[1]==='l',T=cd.h[0]==='t';
    let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;
    if(L)x0=Math.min(x1-MIN,Math.max(0,x0+dx));else x1=Math.max(x0+MIN,Math.min(1,x1+dx));
    if(T)y0=Math.min(y1-MIN,Math.max(0,y0+dy));else y1=Math.max(y0+MIN,Math.min(1,y1+dy));
    let w=x1-x0,h=y1-y0;
    if(r){h=w/r;const maxH=T?o.y+o.h:1-o.y;if(h>maxH){h=maxH;w=h*r}if(L)x0=x1-w;else x1=x0+w;if(T)y0=(o.y+o.h)-h;else y1=y0+h}
    B={x:L?x0:o.x,y:T?y0:o.y,w,h};
  }
  layoutCrop();
});
['pointerup','pointercancel'].forEach(t=>$('crop').addEventListener(t,()=>{cd=null}));
addEventListener('resize',()=>{if(cropping)layoutCrop()});
$('ctb').addEventListener('click',e=>{
  e.stopPropagation();
  const r=e.target.closest('#ratios button');if(r){cropStart(+r.dataset.r);return}
  const id=e.target.id;
  if(id==='cok')cropEnd(true);else if(id==='cno')cropEnd(false);
  else if(id==='cfull'){B={x:0,y:0,w:1,h:1};fitRatio();layoutCrop()}
});
pn.addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='cstart')cropStart(0);
  else if(id==='creset'){Object.assign(P,{cx:0,cy:0,cw:1,ch:1});sync();store();schedule();say(L('Image entière','Whole image'))}
});

$('save').onclick=async()=>{
  if(!src)return;
  say(L('Rendu en pleine résolution…','Rendering at full resolution…'));
  await new Promise(r=>setTimeout(r,30));
  tok++;const my=tok;let r=null;pg.classList.add('on');
  try{r=await render(4096,my)}catch(e){}
  pg.classList.remove('on');prog(0);
  if(!r){say(L('Rendu interrompu, réessaie','Render interrupted, try again'));return}
  show(r);
  const name=`recompresse-${P.seed%10000}.jpg`;
  if(window.Android){const fr=new FileReader();fr.onload=()=>Android.save(fr.result.split(',')[1],name);fr.readAsDataURL(r.blob);return}
  const a=document.createElement('a');a.href=outURL;a.download=name;document.body.appendChild(a);a.click();a.remove();say(L('Image enregistrée','Image saved'));
};

// ------------------------------------------------------------ undo / redo
const snap=()=>JSON.stringify(P);
let hist=[snap()],hi=0,histT=null,applying=false;
function histBtns(){$('undo').disabled=hi<=0;$('redo').disabled=hi>=hist.length-1}
function commit(){
  clearTimeout(histT);
  if(g&&g.on){histT=setTimeout(commit,300);return}   // no history point in the middle of a drag
  const cur=snap();if(cur===hist[hi])return;
  hist=hist.slice(0,hi+1);hist.push(cur);if(hist.length>150)hist.shift();hi=hist.length-1;histBtns();
}
function histSoon(){if(applying)return;clearTimeout(histT);histT=setTimeout(commit,450)}
function jump(d){
  commit();
  const n=hi+d;if(n<0||n>=hist.length)return;
  if(cropping)cropEnd(false);
  hi=n;applying=true;P=Object.assign({seed:1234},DEF,JSON.parse(hist[hi]));
  sync();store();applying=false;histBtns();schedule();
}
$('undo').onclick=()=>jump(-1);$('redo').onclick=()=>jump(1);
